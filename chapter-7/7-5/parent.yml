stages:
  - build
  - deploy

plan_infra:
  stage: build
  image: hashicorp/terraform:latest
  script:
    - terraform init
    - terraform plan -out=plan.tfplan
  artifacts:
    paths:
      - plan.tfplan
    expire_in: 1 hour

trigger_apply:
  stage: deploy
  trigger:
    project: platform/deploy-pipeline
    branch: main
    strategy: depend
  variables:
    PARENT_ID: $CI_PIPELINE_ID
