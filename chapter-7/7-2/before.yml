jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: terraform init

      - name: Run tests
        run: terraform test

      - name: Construct plan file
        run: terraform plan -out=plan.tfplan
